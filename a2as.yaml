manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: victoremeka/macrozero
    source: https://github.com/victoremeka/macrozero
    branch: main
    commit: "96244f3b"
    scope: [agents/agents.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:53:59Z'
    url: https://a2as.org/certified/agents/victoremeka/macrozero
  signatures:
    digest: sha256:F3BOonvzhGCvDpQ_U2UVqSmusX2abPLq-YTRXY2Z5cw
    key: ed25519:opPD_XCnwc_9jNS6Jrjn_saMKbrIq19E8j0gdB7V-2o
    sig: ed25519:BVxIllUawSgoxW6ymAZ1BUl_I9iQCTHt-QIHWyx_ZcWdj1vmwNOhAuYoyOcONE9dMtjrNm7EWr5tNBNjTzxWDg

agents:
  reviewer_agent:
    type: instance
    models: [gemini/gemini-2.5-flash]
    params:
      name: code_review_agent
      instruction: review_prompt
      output_schema: CodeReview
  summarizer_agent:
    type: instance
    models: [gemini/gemini-2.5-flash-lite]
    params:
      name: code_review_agent
      instruction: summary_prompt
      output_key: technical_summary

models:
  gemini/gemini-2.5-flash:
    type: function
    agents: [reviewer_agent]
    params:
      wrapper: LiteLlm
      model: gemini/gemini-2.5-flash
  gemini/gemini-2.5-flash-lite:
    type: function
    agents: [summarizer_agent]
    params:
      wrapper: LiteLlm
      model: gemini/gemini-2.5-flash-lite

imports:
  _installation_token: integrations.github_client._installation_token
  Any: typing.Any
  asyncio: asyncio
  b64decode: base64.b64decode
  BaseModel: pydantic.BaseModel
  DatabaseSessionService: google.adk.sessions.DatabaseSessionService
  dotenv: dotenv
  Field: pydantic.Field
  genai: google.genai
  GITHUB_WEBHOOK_SECRET: integrations.github_client.GITHUB_WEBHOOK_SECRET
  handle_pull_request: pr_handler.handle_pull_request
  hashlib: hashlib
  hmac: hmac
  HTTPException: fastapi.HTTPException
  InMemorySessionService: google.adk.sessions.InMemorySessionService
  json: json
  LiteLlm: google.adk.models.lite_llm.LiteLlm
  Literal: typing.Literal
  LlmAgent: google.adk.agents.LlmAgent
  os: os
  q: router.handler.q
  Queue: rq.Queue
  r_conn: router.handler.r_conn
  re: re
  Request: fastapi.Request
  requests: requests
  review_pr: agents.agents.review_pr
  Runner: google.adk.runners.Runner
  SequentialAgent: google.adk.agents.SequentialAgent
  types: google.genai.types

functions:
  _review_pr_async:
    type: async
    module: agents.agents
    args: [pr_files, diff, user_id]
  call_agent:
    type: async
    module: agents.agents
    args: [agent, query, session_service, app_name, user_id, session_id]
  dump_to_json:
    type: sync
    module: pr_handler
    args: [payload, name, is_json]
  embed:
    type: sync
    module: pr_handler
    args: [str]
  format_diff:
    type: sync
    module: pr_handler
    args: [diff]
  get_pr_files:
    type: sync
    module: pr_handler
    args: [repo_owner, repo_name, number, installation_token]
    params:
      returns: str
  handle_pull_request:
    type: sync
    module: pr_handler
    args: [payload]
  handle_webhook_payload:
    type: async
    module: github_webhook
    args: [request]
  resolve_pending_review:
    type: sync
    module: pr_handler
    args: [repo_owner, repo_name, pr_number, status, installation_token]
  review_pr:
    type: sync
    module: agents.agents
    args: [pr_files, diff, user_id]
  submit_review:
    type: sync
    module: pr_handler
    args: [review_job_id, owner, repo, pull_number]
  verify_signature:
    type: sync
    module: github_webhook
    args: [raw, sig_header]

variables:
  DB_URL:
    type: env
    params:
      caller: [os.getenv]
      path: [agents.agents]
  GEMINI_API_KEY:
    type: env
    params:
      caller: [os.getenv, genai.Client]
      path: [pr_handler]

files:
  agents/code_review_prompt.txt:
    type: literal
    actions: [read]
    params:
      caller: [open]
      alias: [f]
  agents/technical_summary_prompt.txt:
    type: literal
    actions: [read]
    params:
      caller: [open]
      alias: [f]

networks:
  api.github.com:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      caller: [submit_review]
